<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocky 2000 - Login/Sign Up</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Dark background -->
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Message Box for Alerts (Replaces browser alert()) -->
    <div id="message-box" class="fixed top-4 right-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="message-content" class="rounded-lg shadow-xl p-4 max-w-sm bg-red-600 text-white flex items-center space-x-2"></div>
    </div>

    <!-- Auth Container -->
    <div class="w-full max-w-md">
        <!-- Dark mode card -->
        <div class="bg-gray-800 p-10 rounded-xl shadow-2xl space-y-6 border border-indigo-600/30">
            <div class="text-center">
                <div class="flex justify-center items-center mb-3 space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <h1 class="text-3xl font-extrabold text-white">STOCKY2000</h1>
                </div>
                <!-- Title and subtitle are dynamic -->
                <h2 id="form-title" class="text-2xl font-bold text-white mt-4">Sign In to STOCKY2000</h2>
                <p id="form-subtitle" class="mt-2 text-sm text-gray-400">
                    Access your trading dashboard and analytics.
                </p>
            </div>
            
            <!-- Dynamic Authentication Form -->
            <form id="auth-form" onsubmit="handleAuthAction(event)" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-600 bg-gray-700 text-white rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
                        value="">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-600 bg-gray-700 text-white rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
                        value="">
                </div>
                
                <!-- Confirm Password field, visible only for Sign Up -->
                <div id="confirm-password-group" class="hidden"> 
                    <label for="confirm-password" class="block text-sm font-medium text-gray-300">Confirm Password</label>
                    <input id="confirm-password" name="confirm-password" type="password"
                        class="mt-1 block w-full px-4 py-2 border border-gray-600 bg-gray-700 text-white rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"
                        value="">
                </div>

                <button type="submit" id="auth-button"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                    Sign In
                </button>
            </form>
            
            <!-- Toggle Link between Sign In and Sign Up -->
            <p class="text-center text-sm text-gray-400 pt-2">
                <span id="toggle-prompt">Don't have an account?</span>
                <button onclick="toggleMode()" class="font-medium text-indigo-400 hover:text-indigo-300 transition duration-150 ease-in-out ml-1">
                    <span id="toggle-link">Sign Up</span>
                </button>
            </p>
        </div>
    </div>

    <script type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, 
            signInWithCustomToken, signInAnonymously, createUserWithEmailAndPassword // Added for Sign Up
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug');

        // --- GLOBAL VARIABLES & INITIALIZATION ---
        let auth, app;
        let currentMode = 'login'; // State to track 'login' or 'signup'
        
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);

                // Authentication State Listener
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        // REMOVED USER ID DISPLAY
                        showCustomMessage('success', `Welcome back! Authentication successful.`, 'check-circle');
                        console.log("User logged in. Ready to redirect or show dashboard content.");
                    } else {
                        // Attempt initial sign-in if needed
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    }
                });
            } else {
                console.warn("Firebase config is missing. Authentication will be unavailable.");
            }
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
        }

        // --- UI TOGGLE AND VIEW MANAGEMENT ---

        function updateUIForMode() {
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const authButton = document.getElementById('auth-button');
            const togglePrompt = document.getElementById('toggle-prompt');
            const toggleLink = document.getElementById('toggle-link');
            const confirmPasswordGroup = document.getElementById('confirm-password-group');
            const confirmPasswordInput = document.getElementById('confirm-password');

            // Reset button to initial text state before applying mode-specific changes
            authButton.disabled = false;
            
            if (currentMode === 'login') {
                title.textContent = 'Sign In to STOCKY2000';
                subtitle.textContent = 'Access your trading dashboard and analytics.';
                authButton.innerHTML = 'Sign In';
                togglePrompt.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign Up';
                confirmPasswordGroup.classList.add('hidden');
                confirmPasswordInput.removeAttribute('required'); 
            } else { // signup
                title.textContent = 'Create a New Account';
                subtitle.textContent = 'Start tracking your investments now.';
                authButton.innerHTML = 'Sign Up';
                togglePrompt.textContent = "Already have an account?";
                toggleLink.textContent = 'Sign In';
                confirmPasswordGroup.classList.remove('hidden');
                confirmPasswordInput.setAttribute('required', 'required');
            }
            // Re-render icons if needed
            lucide.createIcons();
        }

        window.toggleMode = function() {
            // Clear inputs when toggling
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('confirm-password').value = '';

            currentMode = currentMode === 'login' ? 'signup' : 'login';
            updateUIForMode();
        }

        // --- AUTHENTICATION HANDLER (Renamed from handleSignIn) ---
        window.handleAuthAction = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const authButton = document.getElementById('auth-button');
            
            authButton.disabled = true;
            authButton.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin mr-2 inline"></i> Processing...';
            lucide.createIcons();

            // 1. Input Validation Check
            if (!email || !password || (currentMode === 'signup' && !confirmPassword)) {
                handleAuthError({ code: 'client/missing-fields' });
                updateUIForMode(); // Reset button
                return;
            }

            if (currentMode === 'signup' && password !== confirmPassword) {
                handleAuthError({ code: 'client/password-mismatch' });
                updateUIForMode(); // Reset button
                return;
            }

            // 2. Firebase Action
            try {
                if (!auth) {
                    throw { code: 'client/service-unavailable' };
                }

                if (currentMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else { // signup
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                handleAuthError(error);
            } finally {
                // If auth failed, reset the button state via updateUIForMode
                if (!auth.currentUser) {
                    updateUIForMode(); 
                }
            }
        }

        function handleAuthError(error) {
            let message = 'An unknown sign-in error occurred.';
            // Map Firebase errors to user-friendly messages
            if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                message = 'Invalid email or password.';
            } else if (error.code === 'auth/email-already-in-use') {
                message = 'This email is already registered. Try signing in.';
            } else if (error.code === 'auth/weak-password') {
                message = 'Password must be at least 6 characters long.';
            } else if (error.code === 'client/missing-fields') {
                message = 'Please fill in all required fields.';
            } else if (error.code === 'client/password-mismatch') {
                message = 'Passwords do not match.';
            }
             else if (error.code) {
                // Generic handler for other Firebase codes
                message = error.code.split('/')[1].replace(/-/g, ' ');
            }
            showCustomMessage('error', message, 'x');
        }


        // --- CUSTOM MESSAGE BOX FUNCTION (replaces alert) ---
        function showCustomMessage(type, message, icon) {
            const box = document.getElementById('message-box');
            const content = document.getElementById('message-content');
            let bgColor = 'bg-red-600';

            if (type === 'success') {
                bgColor = 'bg-green-600';
            } else if (type === 'info') {
                 bgColor = 'bg-blue-600';
            }

            content.className = `rounded-lg shadow-xl p-4 max-w-sm ${bgColor} text-white flex items-center space-x-2`;
            content.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
            
            box.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.add('opacity-100');
            lucide.createIcons();

            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
                setTimeout(() => {
                    box.classList.add('pointer-events-none');
                }, 300);
            }, 4000);
        }

        // --- INITIAL RENDER ---
        window.onload = function() {
            lucide.createIcons(); 
            updateUIForMode(); // Initialize the form to 'login' state
        }
    </script>
</body>
</html>
