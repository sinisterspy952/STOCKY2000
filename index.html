<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | STOCKY2000</title> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">STOCKY2000</div> 
        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="predictions.html">Predictions</a>
        </div>
    </nav>

    <main>
        <header>
            <h1>STOCKY2000 Dashboard</h1>
            <p>Search for a stock ticker to view real-time data.</p>
        </header>

        <section class="search-section">
            <input type="text" id="stock-ticker-input" placeholder="Search for Ticker (e.g., AAPL, GOOGL)">
            <button id="search-button">Search Stock</button>
        </section>

        <section class="stock-info" id="stock-display-area">
            <h2>Welcome to STOCKY2000</h2>
            <p>Use the search bar above to look up stock information.</p>
            
            <div class="stock-details">
                <p>Current Price: <span id="current-price">--</span></p>
                <p>Today's Change: <span id="daily-change">--</span></p>
            </div>

            <div class="chart-placeholder">
                [Placeholder for Interactive Chart]
            </div>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
