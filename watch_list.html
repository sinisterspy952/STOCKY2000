<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocky 2000 - Watch List</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Style for the table header to ensure sticky scroll */
        .sticky-header {
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<!-- Dark background matching the dashboard -->
<body class="bg-gray-900 min-h-screen flex flex-col antialiased text-white">

    <!-- Message Box for Custom Alerts/Errors -->
    <div id="message-box" class="fixed top-4 right-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="message-content" class="rounded-lg shadow-xl p-4 max-w-sm bg-red-600 text-white flex items-center space-x-2"></div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="flex-grow flex flex-col">

        <!-- Navigation Bar -->
        <nav id="navbar" class="bg-gray-800 shadow-xl border-b border-indigo-600/30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span class="text-xl font-bold text-white">Stocky 2000</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="user-email-display" class="text-sm font-medium text-gray-400">Loading User...</span>
                        <button onclick="handleSignOut()" class="bg-red-600 hover:bg-red-700 text-white font-medium py-1.5 px-3 rounded-lg shadow-md transition duration-150 ease-in-out flex items-center">
                            <i data-lucide="log-out" class="w-4 h-4 mr-1"></i> Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Page Content Area -->
        <main id="watchlist-content" class="flex-grow p-4 md:p-8 overflow-y-auto">
            
            <div id="loading-spinner" class="text-center py-20">
                 <i data-lucide="loader" class="w-10 h-10 animate-spin text-indigo-500 mx-auto"></i>
                 <p class="mt-4 text-gray-400">Loading watch list...</p>
            </div>

            <!-- Watch List View (Hidden until data loads) -->
            <div id="data-view" class="max-w-7xl mx-auto opacity-0 transition-opacity duration-500">
                <header class="mb-8 border-b border-gray-700 pb-4">
                    <h1 class="text-4xl font-extrabold text-white">My Watch List</h1>
                    <p class="text-gray-400">Track stocks you're interested in.</p>
                </header>

                <!-- Stock Input Form -->
                <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-indigo-600/30 mb-8">
                    <h2 class="text-xl font-semibold mb-4">Add New Ticker</h2>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="new-ticker-input" placeholder="e.g., TSLA, NVDA, AMZN" class="flex-grow bg-gray-700 text-white p-3 rounded-lg border border-gray-600 focus:ring-indigo-500 focus:border-indigo-500 uppercase" maxlength="5">
                        <button onclick="handleAddStock()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg shadow-md transition duration-150 ease-in-out flex items-center justify-center">
                            <i data-lucide="plus" class="w-5 h-5 mr-2"></i> Add Stock
                        </button>
                    </div>
                </div>

                <!-- Watch List Table -->
                <div class="bg-gray-800 rounded-xl shadow-lg border border-indigo-600/30 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-700">
                            <!-- Table Header -->
                            <thead class="bg-gray-700 sticky-header">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Ticker</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Company</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">Price</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">Change (24h)</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">Market Cap</th>
                                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-400 uppercase tracking-wider">Action</th>
                                </tr>
                            </thead>
                            <!-- Table Body -->
                            <tbody id="watchlist-table-body" class="divide-y divide-gray-700">
                                <!-- Stock rows will be injected here -->
                            </tbody>
                        </table>
                        
                        <div id="empty-state" class="p-6 text-center text-gray-500 hidden">
                            <i data-lucide="clipboard-list" class="w-8 h-8 mx-auto mb-2"></i>
                            <p>Your watch list is empty. Add a stock to start tracking!</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signOut, onAuthStateChanged, 
            signInWithCustomToken, signInAnonymously 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Enable Firebase debugging
        setLogLevel('debug');

        // --- GLOBAL VARIABLES & INITIALIZATION ---
        let auth, db, app;
        let isAuthReady = false;
        let currentWatchlist = {}; // Store watch list items as objects for easy management { Ticker: {data...} }

        // Use environment variables for Firebase configuration (MANDATORY in this environment)
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // --- AUTHENTICATION SETUP ---
                onAuthStateChanged(auth, async (user) => {
                    isAuthReady = true;
                    if (user) {
                        document.getElementById('user-email-display').textContent = user.email || 'Anonymous User';
                        loadWatchlistData(true);
                    } else {
                        showUnauthenticatedWarning();
                        
                        // Attempt initial token or anonymous sign-in if needed
                        if (initialAuthToken) {
                            try {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } catch (error) {
                                console.error("Error signing in with custom token:", error);
                                await signInAnonymously(auth);
                            }
                        } else {
                            await signInAnonymously(auth);
                        }
                    }
                });
            } else {
                showCustomMessage('error', 'Firebase config not found. Cannot initialize Firebase.', 'x');
                console.error("Firebase config is empty.");
                showUnauthenticatedWarning(true);
            }
        } catch (error) {
            showCustomMessage('error', 'Failed to initialize Firebase.', 'x');
            console.error("Initialization Error:", error);
        }
        
        // --- DATA LOADING & MOCK DATA ---
        function loadWatchlistData(isAuthenticated = false) {
            if (!isAuthenticated || !isAuthReady || !document.getElementById('watchlist-table-body')) {
                console.log("loadWatchlistData skipped: User not authenticated or DOM not ready.");
                return;
            }

            // Mock initial data
            const mockStocks = [
                { ticker: 'AAPL', name: 'Apple Inc.', price: 185.20, change: 1.52, changePct: 0.83, marketCap: 2850000000000, gain: true },
                { ticker: 'TSLA', name: 'Tesla, Inc.', price: 215.75, change: -3.10, changePct: -1.42, marketCap: 680000000000, gain: false },
                { ticker: 'MSFT', name: 'Microsoft Corp.', price: 370.45, change: 0.15, changePct: 0.04, marketCap: 3100000000000, gain: true },
            ];
            
            mockStocks.forEach(stock => currentWatchlist[stock.ticker] = stock);

            // Simulate data fetching delay
            setTimeout(() => {
                renderWatchlist();
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('data-view').classList.remove('opacity-0');
                showCustomMessage('success', 'Watch list loaded successfully.', 'check-circle');
            }, 1500);
        }
        
        function formatCurrency(value) {
            return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatMarketCap(value) {
            if (value >= 1000000000) return (value / 1000000000).toFixed(2) + 'B';
            return value.toLocaleString('en-US');
        }

        function renderWatchlist() {
            const tbody = document.getElementById('watchlist-table-body');
            const emptyState = document.getElementById('empty-state');
            if (!tbody || !emptyState) return;

            // Convert map to array and sort by ticker
            const stocks = Object.values(currentWatchlist).sort((a, b) => a.ticker.localeCompare(b.ticker));
            
            tbody.innerHTML = '';

            if (stocks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                stocks.forEach(stock => {
                    const priceClass = stock.gain ? 'text-green-400' : 'text-red-400';
                    const sign = stock.gain ? '+' : '-';
                    const icon = stock.gain ? 'trending-up' : 'trending-down';

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-700 transition duration-100';
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-indigo-400">${stock.ticker}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${stock.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-right">${formatCurrency(stock.price)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${priceClass} text-right">
                            <span class="inline-flex items-center">
                                <i data-lucide="${icon}" class="w-4 h-4 mr-1"></i>
                                ${sign}${stock.change.toFixed(2)} (${sign}${(stock.changePct).toFixed(2)}%)
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400 text-right">${formatMarketCap(stock.marketCap)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <button onclick="handleRemoveStock('${stock.ticker}')" class="text-red-500 hover:text-red-600 transition duration-150 p-2 rounded-full hover:bg-red-900/50">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            lucide.createIcons();
        }
        
        // --- ACTION HANDLERS (MOCK) ---

        window.handleAddStock = function() {
            const input = document.getElementById('new-ticker-input');
            const ticker = input.value.trim().toUpperCase();

            if (ticker.length < 1) {
                showCustomMessage('error', 'Please enter a valid ticker symbol.', 'alert-triangle');
                return;
            }

            if (currentWatchlist[ticker]) {
                 showCustomMessage('info', `${ticker} is already in your watch list.`, 'info');
                return;
            }

            // Simulate adding to Firestore and getting a response
            const mockNewStock = {
                ticker: ticker, 
                name: `Company Name for ${ticker}`, 
                price: (Math.random() * 500 + 50).toFixed(2), 
                change: (Math.random() * 5 * (Math.random() > 0.5 ? 1 : -1)).toFixed(2), 
                changePct: (Math.random() * 2 * (Math.random() > 0.5 ? 1 : -1)).toFixed(2), 
                marketCap: Math.floor(Math.random() * 500000000000), 
                gain: Math.random() > 0.5
            };

            currentWatchlist[ticker] = mockNewStock;
            renderWatchlist();
            showCustomMessage('success', `${ticker} added to watch list!`, 'check');
            input.value = ''; // Clear input
        }

        window.handleRemoveStock = function(ticker) {
            if (currentWatchlist[ticker]) {
                delete currentWatchlist[ticker];
                renderWatchlist();
                showCustomMessage('info', `${ticker} removed from watch list.`, 'x');
            }
        }

        // --- AUTHENTICATION HANDLERS ---
        window.handleSignOut = async function() {
            try {
                if (auth) {
                    await signOut(auth);
                    showCustomMessage('info', 'You have been signed out. Redirecting to login...', 'log-out');
                    setTimeout(() => { showUnauthenticatedWarning(); }, 1000);
                } else {
                     showCustomMessage('info', 'Signed out (Mock).', 'log-out');
                     showUnauthenticatedWarning(); 
                }
            } catch (error) {
                console.error("Error signing out:", error);
                showCustomMessage('error', 'Error signing out.', 'x');
            }
        }

        function showUnauthenticatedWarning(fatal = false) {
            const content = document.getElementById('watchlist-content');
            content.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[calc(100vh-80px)] text-center p-4">
                    <i data-lucide="lock" class="w-12 h-12 text-red-500 mb-4"></i>
                    <h2 class="text-3xl font-bold text-white mb-2">Access Denied</h2>
                    <p class="text-gray-400 max-w-sm">${fatal ? 'The application failed to initialize authentication. Please check configuration.' : 'You must be signed in to view the watch list.'}</p>
                    <a href="#" onclick="showCustomMessage('info', 'This application is single-page, but typically a redirect would happen here.', 'info'); return false;" class="mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-150">
                        Go to Login Page
                    </a>
                </div>
            `;
             lucide.createIcons();
        }

        // --- CUSTOM MESSAGE BOX FUNCTION ---
        function showCustomMessage(type, message, icon) {
            const box = document.getElementById('message-box');
            const content = document.getElementById('message-content');
            let bgColor = 'bg-red-600';

            if (type === 'success') {
                bgColor = 'bg-green-600';
            } else if (type === 'info') {
                 bgColor = 'bg-blue-600';
            }

            content.className = `rounded-lg shadow-xl p-4 max-w-sm ${bgColor} text-white flex items-center space-x-2`;
            content.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
            
            box.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.add('opacity-100');

            lucide.createIcons();

            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
                setTimeout(() => {
                    box.classList.add('pointer-events-none');
                }, 300);
            }, 4000);
        }

        // --- INITIAL RENDER ---
        window.onload = function() {
            lucide.createIcons();
        }

    </script>
</body>
</html>
